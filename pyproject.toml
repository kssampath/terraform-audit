[project]
name = "terraform-audit"
version = "0.1.0"
description = "Audits Terraform files for hardcoded secrets and missing tags"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
tf-audit = "terraform_audit.cli:scan"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"